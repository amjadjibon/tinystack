<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">TinyStack architecture</title>
  <desc id="desc">CLI, SDK and infrastructure clients enter the gateway. Generated catalogue bindings invoke services. Services use a transactional memory or SQLite store and call other services or runtime adapters. The console reads diagnostics on a separate port. Pinned Smithy models produce the catalogue.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#51677e"/></marker></defs>
  <rect width="1000" height="680" rx="12" fill="#f6f8fb"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g fill="#192b3f"><rect x="300" y="26" width="400" height="66" rx="9"/><rect x="300" y="132" width="400" height="82" rx="9"/></g>
    <g fill="#fff" font-size="21" font-weight="600"><text x="500" y="54">AWS CLI · SDKs · Terraform · SAM</text><text x="500" y="165">Gateway / API listener</text></g>
    <g fill="#c5d3e1" font-size="15"><text x="500" y="77">Local credentials + endpoint override</text><text x="500" y="190">:4566 · protocol · identity · route · diagnostics</text></g>
    <g fill="#fff" stroke="#c5d3e1" stroke-width="2"><rect x="300" y="256" width="400" height="82" rx="9"/><rect x="300" y="380" width="400" height="82" rx="9"/><rect x="25" y="256" width="230" height="82" rx="9"/><rect x="745" y="132" width="230" height="82" rx="9"/><rect x="25" y="542" width="280" height="100" rx="9"/><rect x="360" y="542" width="280" height="100" rx="9"/><rect x="695" y="542" width="280" height="100" rx="9"/></g>
    <g fill="#192b3f" font-size="21" font-weight="600"><text x="500" y="291">Generated catalogue</text><text x="500" y="415">Service implementations</text><text x="140" y="289">Pinned Smithy</text><text x="860" y="165">Cloudscape console</text><text x="165" y="577">Transactional store</text><text x="500" y="577">In-process calls</text><text x="835" y="577">Runtime adapters</text></g>
    <g fill="#51677e" font-size="15"><text x="500" y="315">Typed inputs · bindings · modeled errors</text><text x="500" y="438">Validation · resource state · execution behavior</text><text x="140" y="315">Models + profile → generator</text><text x="860" y="190">:4567 · resources + diagnostics</text><text x="165" y="604">Memory / SQLite commit hook</text><text x="500" y="604">Events · integrations · caller</text><text x="835" y="604">Docker · k3s · cache nodes</text><text x="165" y="626">Atomic View / Update callbacks</text><text x="500" y="626">Explicit account + region scope</text><text x="835" y="626">External work outside transactions</text></g>
    <g fill="none" stroke="#51677e" stroke-width="2" marker-end="url(#arrow)"><path d="M500 92v40"/><path d="M500 214v42"/><path d="M500 338v42"/><path d="M255 297h45"/><path d="M745 174h-45"/><path d="M400 462v38H165v42"/><path d="M500 462v80"/><path d="M600 462v38h235v42"/></g>
    <rect x="393" y="350" width="214" height="20" rx="10" fill="#fff1dd"/>
    <text x="500" y="365" fill="#8c4b00" font-size="13">Services contain no HTTP decoding</text>
  </g>
</svg>
