# go tool air (task dev): rebuilds the headless binary and restarts it on Go changes.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o tmp/tinystack ./cmd/tinystack"
entrypoint = ["tmp/tinystack", "start"]
include_ext = ["go"]
exclude_dir = [".git", ".task", ".venv-docs", "bin", "docs", "site", "tests", "tmp", "ui"]
exclude_regex = ["_test\\.go$"]
delay = 500
kill_delay = "5s"
send_interrupt = true
stop_on_error = true

[misc]
clean_on_exit = true
