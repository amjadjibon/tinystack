# go tool air (task dev): rebuilds TinyStack with the console and restarts it when Go or console sources change.
# task ui:build skips the console build when nothing under ui/ changed.
root = "."
tmp_dir = "tmp"

[build]
cmd = "task ui:build && go build -tags console -o tmp/tinystack ./cmd/tinystack"
entrypoint = ["tmp/tinystack", "start", "--config", "examples/tinystack.yaml"]
include_ext = ["go", "ts", "tsx", "css", "svg"]
include_file = ["examples/tinystack.yaml", "examples/init/ready.d/10-seed.sh"]
exclude_dir = [
  ".git",
  ".task",
  ".venv-docs",
  "bin",
  "docs",
  "site",
  "tests",
  "tmp",
  "ui/.tanstack",
  "ui/dist",
  "ui/node_modules",
]
exclude_file = ["ui/src/routeTree.gen.ts"]
exclude_regex = ["_test\\.go$"]
delay = 500
kill_delay = "5s"
send_interrupt = true
stop_on_error = true

[misc]
clean_on_exit = true
