version: '3'

tasks:
  default:
    cmds:
      - task --list-all

  all:
    cmds:
      - task generate
      - task lint
      - task test
      - task test:console
      - task build
      - task ui:check
      - task ui:test

  build:
    desc: "Build bin/tinystack with the web console built in (needs Node.js and pnpm)"
    deps: [ui:build]
    cmds:
      - go build -tags console -trimpath -ldflags="-s -w" -o bin/tinystack ./cmd/tinystack

  build:headless:
    desc: "Build bin/tinystack-headless without the web console (needs only Go)"
    cmds:
      - go build -trimpath -ldflags="-s -w" -o bin/tinystack-headless ./cmd/tinystack

  dev:
    desc: "Run TinyStack with sample data (AWS CLI required); rebuild on Go, console, config or seed changes"
    cmds:
      - go tool air -- {{.CLI_ARGS}}

  build:tools:
    desc: "Build bin/aws-local, bin/terraform-local, bin/sam-local, and bin/cdk-local wrappers (and symlinks awslocal, tflocal, samlocal, cdklocal)"
    cmds:
      - go build -o bin/aws-local ./cmd/aws-local
      - go build -o bin/terraform-local ./cmd/terraform-local
      - go build -o bin/sam-local ./cmd/sam-local
      - go build -o bin/cdk-local ./cmd/cdk-local
      - ln -sf aws-local bin/awslocal
      - ln -sf terraform-local bin/tflocal
      - ln -sf sam-local bin/samlocal
      - ln -sf cdk-local bin/cdklocal

  test:
    cmds:
      - go test -race -count=1 -timeout 30m -v ./...
  test:console:
    desc: "Test what only the console build has, the CloudShell and MCP server (embeds the console, so it builds it first)"
    deps: [ui:build]
    cmds:
      - go test -race -count=1 -tags console ./internal/console ./internal/gateway ./internal/services/sts
      - go test -race -count=1 -tags console ./tests/integration -run 'TestShell|TestMCP'
  lint:
    cmds:
      - go vet ./...
      - golangci-lint run ./...
  generate:
    cmds:
      - go generate ./...

  models:sync:
    desc: "Vendor the pinned Smithy models at an aws-sdk-go-v2 ref and regenerate (task models:sync -- -ref main -add sts)"
    cmds:
      - go run ./generator/sync {{.CLI_ARGS}}
      - task generate

  test:docker:
    cmds:
      - TINYSTACK_DOCKER_TESTS=1 go test -race -count=1 ./internal/services/lambda/docker ./internal/services/ecs/docker ./internal/services/eks/k3s ./internal/services/elasticache/docker
      - TINYSTACK_DOCKER_TESTS=1 go test -race -count=1 ./tests/integration -run 'Test(DSQLDocker|RDS(Docker|DataDocker)|BatchDocker|MemoryDBDocker|ElastiCacheDocker|OpenSearchDocker|MQDocker|MSKDocker|CodeBuildDocker|BedrockAgentCoreDocker)'

  test:testcontainers:
    desc: "Test the separate Go Testcontainers module (requires Docker; builds the image unless TINYSTACK_IMAGE is set)"
    dir: tests/testcontainers
    cmds:
      - go test -race -count=1 -timeout 30m -v ./...

  test:testcontainers:python:
    desc: "Test the separate Python Testcontainers module (requires Docker; builds the image unless TINYSTACK_IMAGE is set)"
    dir: tests/testcontainers-python
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install -q -e '.[test]'
      - .venv/bin/pytest -v

  test:testcontainers:java:
    desc: "Test the separate Java Testcontainers module (requires Docker and JDK 17+; builds the image unless TINYSTACK_IMAGE is set)"
    dir: tests/testcontainers-java
    cmds:
      - ./mvnw -q test

  test:testcontainers:node:
    desc: "Test the separate Node Testcontainers module (requires Docker and npm; builds the image unless TINYSTACK_IMAGE is set)"
    dir: tests/testcontainers-node
    cmds:
      - npm test

  test:testcontainers:dotnet:
    desc: "Test the separate .NET Testcontainers module (requires Docker; builds the image unless TINYSTACK_IMAGE is set)"
    dir: tests/testcontainers-dotnet
    cmds:
      - dotnet test

  lint:testcontainers:
    desc: "Vet and lint the separate Go Testcontainers module"
    dir: tests/testcontainers
    cmds:
      - go vet ./...
      - golangci-lint run --allow-serial-runners --config ../../.golangci.yml ./...

  smoke:
    cmds:
      - python3 tests/awscli/smoke.py

  test:terraform:
    cmds:
      - python3 tests/terraform/terraform.py

  test:sam:
    cmds:
      - python3 tests/sam/sam.py

  test:cdk:
    desc: "Bootstrap, deploy, and destroy a CDK app (needs node, the cdk CLI, and the AWS CLI; installs aws-cdk-lib)"
    cmds:
      - python3 tests/cdk/cdk.py

  ui:install:
    desc: "Install the console's dependencies"
    dir: ui
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  ui:dev:
    desc: "Run the console dev server on :4568 (TINYSTACK_URL defaults to http://127.0.0.1:4566)"
    dir: ui
    deps: [ui:install]
    cmds:
      - pnpm dev

  ui:build:
    desc: "Build the console into ui/dist/client and gzip it into ui/dist/console"
    dir: ui
    deps: [ui:install]
    sources:
      - src/**/*
      - public/**/*
      - scripts/**/*
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - tsr.config.json
      - vite.config.ts
      - exclude: src/routeTree.gen.ts
    generates:
      - dist/console/**/*
    cmds:
      - pnpm build

  ui:check:
    desc: "Lint, format-check, and typecheck the console"
    dir: ui
    deps: [ui:install]
    cmds:
      - pnpm check
      - pnpm exec tsc --noEmit

  ui:test:
    desc: "Test console session signing and credential boundaries"
    dir: ui
    deps: [ui:install]
    cmds:
      - pnpm test

  up:
    desc: "Run TinyStack (:4566, console on :4567) with Docker Compose"
    cmds:
      - docker compose up --build {{.CLI_ARGS}}

  docs:install:
    desc: "Create the isolated MkDocs environment and install pinned dependencies"
    sources:
      - docs/requirements.txt
    generates:
      - .venv-docs/.installed
    cmds:
      - python3 -m venv .venv-docs
      - .venv-docs/bin/python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - touch .venv-docs/.installed

  docs:generate:
    desc: "Refresh service support, roadmap, navigation, and CloudFormation resource documentation"
    cmds:
      - python3 scripts/docs.py

  docs:build:
    desc: "Build the MkDocs site strictly into site/"
    deps: [docs:install]
    cmds:
      - task docs:generate
      - .venv-docs/bin/mkdocs build --strict

  docs:check:
    desc: "Check generated documentation freshness and build with strict link/nav validation"
    deps: [docs:install]
    cmds:
      - python3 scripts/docs.py --check
      - .venv-docs/bin/mkdocs build --strict

  docs:serve:
    desc: "Serve MkDocs with live reload on http://127.0.0.1:8000"
    deps: [docs:install]
    cmds:
      - task docs:generate
      - .venv-docs/bin/mkdocs serve -a 127.0.0.1:8000

  down:
    desc: "Stop the Docker Compose stack (task down -- -v also deletes its state)"
    cmds:
      - docker compose down {{.CLI_ARGS}}

  clean:
    cmds:
      - rm -rf bin
      - rm -rf coverage.out
      - rm -rf coverage.html
      - rm -rf coverage.txt
