version: '3'

tasks:
  default:
    cmds:
      - task --list-all

  all:
    cmds:
      - task generate
      - task lint
      - task test
      - task build
      - task ui:check

  build:
    desc: "Build bin/tinystack with the web console built in (needs Node.js and pnpm)"
    deps: [ui:build]
    cmds:
      - go build -tags console -o bin/tinystack ./cmd/tinystack

  build:noui:
    desc: "Build bin/tinystack-noui without the web console (needs only Go)"
    cmds:
      - go build -o bin/tinystack-noui ./cmd/tinystack

  test:
    cmds:
      - go test -race -count=1 -v ./...
  lint:
    cmds:
      - go vet ./...
      - golangci-lint run ./...
  generate:
    cmds:
      - go generate ./...

  models:sync:
    desc: "Vendor the pinned Smithy models at an aws-sdk-go-v2 ref and regenerate (task models:sync -- -ref main -add sts)"
    cmds:
      - go run ./generator/sync {{.CLI_ARGS}}
      - task generate

  test:docker:
    cmds:
      - TINYSTACK_DOCKER_TESTS=1 go test -race -count=1 ./internal/services/lambda/docker ./internal/services/ecs/docker ./internal/services/eks/k3s

  smoke:
    cmds:
      - python3 tests/awscli/smoke.py

  test:terraform:
    cmds:
      - python3 tests/terraform/terraform.py

  test:sam:
    cmds:
      - python3 tests/sam/sam.py

  ui:install:
    desc: "Install the console's dependencies"
    dir: ui
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  ui:dev:
    desc: "Run the console dev server on :4568 (TINYSTACK_URL defaults to http://127.0.0.1:4566)"
    dir: ui
    deps: [ui:install]
    cmds:
      - pnpm dev

  ui:build:
    desc: "Build the console into ui/dist/client"
    dir: ui
    deps: [ui:install]
    cmds:
      - pnpm build

  ui:check:
    desc: "Lint, format-check, and typecheck the console"
    dir: ui
    deps: [ui:install]
    cmds:
      - pnpm check
      - pnpm exec tsc --noEmit

  up:
    desc: "Run TinyStack (:4566, console on :4567) with Docker Compose"
    cmds:
      - docker compose up --build {{.CLI_ARGS}}

  down:
    desc: "Stop the Docker Compose stack (task down -- -v also deletes its state)"
    cmds:
      - docker compose down {{.CLI_ARGS}}

  clean:
    cmds:
      - rm -rf bin
      - rm -rf coverage.out
      - rm -rf coverage.html
      - rm -rf coverage.txt
