name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  unit:
    uses: ./.github/workflows/unit.yml

  integration:
    uses: ./.github/workflows/integration.yml

  # Docs publish to GitHub Pages, so they wait for the checks like the artifacts do.
  docs:
    needs: [lint, unit, integration]
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  binaries:
    name: Binaries and GitHub release
    needs: [lint, unit, integration, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Release notes list the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the console
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build archives with the console built in
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${platform%/*} arch=${platform#*/}
            name="tinystack_${TAG#v}_${os}_${arch}"
            exe=tinystack; [ "$os" = windows ] && exe=tinystack.exe
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags console -trimpath -o "dist/$name/$exe" \
              -ldflags="-s -w -X github.com/amjadjibon/tinystack/internal/cmd.version=${TAG#v} \
              -X github.com/amjadjibon/tinystack/internal/cmd.commit=${GITHUB_SHA::12}" ./cmd/tinystack
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum -- * > checksums.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=; [[ "$TAG" == *-* ]] && prerelease=--prerelease
          scripts/release-notes.sh "$TAG" > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.md $prerelease
      # HOMEBREW_TAP_TOKEN is a fine-grained token with Contents write on amjadjibon/homebrew-tap only.
      - name: Update the Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/amjadjibon/homebrew-tap.git" tap
          scripts/homebrew-formula.sh "$TAG" dist/checksums.txt > tap/Formula/tinystack.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tinystack.rb
          git diff --cached --quiet || git commit -m "tinystack ${TAG#v}"
          git push origin HEAD:main

  image:
    name: ${{ matrix.target }} image
    needs: [lint, unit, integration, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: console-image
            suffix: ""
          - target: headless
            suffix: -headless
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # latest (or headless) moves only for releases without a prerelease suffix.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ matrix.suffix == '' && !contains(github.ref_name, '-') }}
            type=raw,value=headless,suffix=,enable=${{ matrix.suffix != '' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
