name: Lint

# release.yml runs this before publishing a tag.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go generate, vet, and golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check generated code is current
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Lint the Go Testcontainers module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: tests/testcontainers
          args: --config ../../.golangci.yml

  # Release archives include Windows and macOS; vet type-checks every package and its tests for both, with and
  # without the console tag, so platform-specific code breaks here instead of in the release job.
  platforms:
    name: Go vet for Windows and macOS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Stand in for the console bundle, which the console tag embeds
        run: mkdir -p ui/dist/console && echo '<!doctype html>' > ui/dist/console/index.html
      - name: Vet each platform with and without the console
        run: |
          for os in windows darwin; do
            for tags in '' console; do
              echo "::group::GOOS=$os tags=${tags:-none}"
              GOOS=$os go vet -tags "$tags" ./...
              echo "::endgroup::"
            done
          done

  console:
    name: Console Biome and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsc --noEmit
