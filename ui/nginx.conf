server {
	listen 4567;
	root /usr/share/nginx/html;

	# The console reads TinyStack's own endpoints from the same origin.
	location /_tinystack/ {
		proxy_pass http://tinystack:4566;
		proxy_set_header Host $host;
	}

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Every other path is a client-side route of the single-page app.
	location / {
		try_files $uri /_shell.html;
	}
}
