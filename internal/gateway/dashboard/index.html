<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyStack</title>
  <!-- An empty icon stops browsers requesting /favicon.ico, which is an S3 path. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/_tinystack/app.css">
  <script src="/_tinystack/app.js" defer></script>
</head>
<body>
  <header>
    <h1>TinyStack</h1>
    <span id="services"></span>
    <label><input type="checkbox" id="live" checked> Live</label>
  </header>
  <nav>
    <button data-tab="requests" class="active">Requests</button>
    <button data-tab="deliveries">Deliveries</button>
    <button data-tab="resources">Resources</button>
    <button data-tab="metrics">Metrics</button>
    <input id="filter" type="search" placeholder="Filter">
    <button id="clear" title="Clear this list">Clear</button>
  </nav>
  <main>
    <table>
      <thead id="head"></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty">Nothing yet.</p>
  </main>
  <aside id="detail" hidden>
    <button id="close">Close</button>
    <div id="detail-body"></div>
  </aside>
</body>
</html>
