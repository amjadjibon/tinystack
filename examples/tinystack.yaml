server:
  host: 127.0.0.1
  port: 4566
  # The web console (task build); 0 turns it off.
  console_port: 4567
defaults:
  account: "000000000000"
  region: us-east-1
identity:
  # parse maps access keys to accounts without checking signatures; verify also
  # requires SigV4 signatures from the keys in secret_keys.
  mode: parse
  accounts:
    test: "000000000000"
    team-b: "111111111111"
storage:
  # memory loses state on exit; persistent keeps it in <path>/state.db.
  mode: memory
  # mode: persistent
  # path: ~/.tinystack
ecs:
  # records keeps ECS tasks as records; docker also runs their containers.
  containers: records
eks:
  # records keeps EKS clusters as records; k3s also runs their API servers.
  clusters: records
elasticache:
  # records keeps caches as records; docker also runs each node in a container.
  caches: records
iot:
  # MQTT over TLS with device certificates; 0 turns it off.
  # mqtts_port: 8883
  # Plain MQTT without authentication, as the default account and Region
  # (identity.mode: parse only); 0 turns it off. MQTT over WebSocket is always
  # served at /mqtt on the server port.
  mqtt_port: 0
