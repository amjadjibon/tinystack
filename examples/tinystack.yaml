server:
  host: 127.0.0.1
  port: 4566
  console_port: 4567
defaults:
  account: "000000000000"
  region: us-east-1
identity:
  mode: parse
  authorization: enforce
  accounts:
    test-a: "000000000000"
    team-b: "111111111111"
storage:
  mode: persistent
  path: ~/.tinystack
init:
  # Idempotent IAM/S3/SQS development data; requires the AWS CLI on PATH.
  dir: ./examples/init
ecs:
  # records keeps ECS tasks as records; docker also runs their containers.
  containers: records
eks:
  # records keeps EKS clusters as records; k3s also runs their API servers.
  clusters: records
elasticache:
  # records keeps caches as records; docker also runs each node in a container.
  caches: records
opensearch:
  # records keeps domains as records; docker runs each domain's engine in a container with a named data volume.
  domains: records
rds:
  # records has no SQL listener; docker runs database containers with named data volumes.
  instances: records
iot:
  # MQTT over TLS with device certificates; 0 turns it off.
  # mqtts_port: 8883
  # Plain MQTT without authentication, as the default account and Region
  # (identity.mode: parse only); 0 turns it off. MQTT over WebSocket is always
  # served at /mqtt on the server port.
  mqtt_port: 0

ec2:
  # records is the default; lima and qemu boot real Linux VMs using user-installed tools.
  runtime: records
  vm:
    max_vms: 2
    max_memory_mib: 4096
  lima:
    command: limactl
  qemu:
    system_command:
      arm64: qemu-system-aarch64
      x86_64: qemu-system-x86_64
    img_command: qemu-img
    allow_tcg: false
    # firmware: /path/to/edk2-aarch64-code.fd
    # cache_dir: /path/to/tinystack/ec2-images
    # state_dir: /path/to/tinystack/ec2-vms
