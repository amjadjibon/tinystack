    email: 'admin@example.test'
    groups:
      - 'platform-admins'
  dev:
    disabled: false
    displayname: 'Dev Developer'
    password: '$argon2id$v=19$m=65536,t=3,p=4$vEETdwxa32hHpDZRUkxJtA$JrfyyJuoWJTzphIOumXMN0K91HUqdyiqPkiV69nzbsg'
