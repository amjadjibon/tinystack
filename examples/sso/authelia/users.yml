# DEVELOPMENT ONLY. Do not reuse these accounts or passwords anywhere else.
#
#   admin / admin   groups platform-admins + team-b-dev -> choose Admin or Developer
#   dev   / dev     group team-b-dev      -> role Developer (S3 and SQS only)
#
# The passwords are argon2id digests, as Authelia's file backend stores them. Make new ones with
#   docker run --rm authelia/authelia:4.39.28 authelia crypto hash generate argon2 --password '<password>'
users:
  admin:
    disabled: false
    displayname: 'Ada Admin'
    password: '$argon2id$v=19$m=65536,t=3,p=4$ZcOqV1WSV9bWNZShjTluDQ$1jnqbsZZzTS+K29NibqhCSglbzHYzcM5QKqMT0tYsso'
    email: 'admin@example.test'
    groups:
      - 'platform-admins'
      - 'team-b-dev'
  dev:
    disabled: false
    displayname: 'Dev Developer'
    password: '$argon2id$v=19$m=65536,t=3,p=4$UmkGG8YEC29mzI/bnySFuA$wQHm/AmiFoZhy8tpsyNBRRE8snVhnjIzPqQrCw6QKAk'
    email: 'dev@example.test'
    groups:
      - 'team-b-dev'
